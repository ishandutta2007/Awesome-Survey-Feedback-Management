<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes barGrow {
        0%, 100% { height: 42px; y: 48px; }
        50% { height: 68px; y: 22px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 60px; y: 30px; }
        50% { height: 35px; y: 55px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 75px; y: 15px; }
        50% { height: 85px; y: 5px; }
      }
      @keyframes blinkLive {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes sweepLight {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }

      .floating-card-1 { animation: floatSlow1 7s ease-in-out infinite; transform-origin: center; }
      .floating-card-2 { animation: floatSlow2 8.5s ease-in-out infinite; transform-origin: center; }
      .ambient-glow { animation: pulseGlow 9s ease-in-out infinite; transform-origin: center; }
      .bar-anim-1 { animation: barGrow 4s ease-in-out infinite; }
      .bar-anim-2 { animation: barGrow2 4.5s ease-in-out infinite; }
      .bar-anim-3 { animation: barGrow3 3.8s ease-in-out infinite; }
      .live-dot { animation: blinkLive 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Ambient Dynamic Glows (Behind all cards & text) -->
  <ellipse class="ambient-glow" cx="240" cy="180" rx="280" ry="160" fill="url(#cyanGlow)" filter="url(#blurFilter)"/>
  <ellipse class="ambient-glow" cx="950" cy="220" rx="300" ry="180" fill="url(#glowPulse)" filter="url(#blurFilter)"/>

  <!-- BACKGROUND GRAPHICAL ELEMENTS (Kept on periphery to prevent occluding text) -->
  
  <!-- Left Side Floating Card: Live CSAT & Survey Metrics -->
  <g class="floating-card-1" transform="translate(60, 65)">
    <rect width="210" height="120" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" filter="url(#dropShadow)"/>
    <!-- Metric Header -->
    <circle cx="28" cy="30" r="7" fill="#38bdf8" fill-opacity="0.2"/>
    <circle class="live-dot" cx="28" cy="30" r="4" fill="#38bdf8"/>
    <text x="44" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">NET PROMOTER SCORE</text>
    <text x="24" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">+78 <tspan font-size="14" font-weight="600" fill="#34d399">NPS</tspan></text>
    <text x="24" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">↑ 98.4% Customer Satisfaction</text>
  </g>

  <!-- Left Side Bottom Floating Card: Form Completion Flow -->
  <g class="floating-card-2" transform="translate(75, 225)">
    <rect width="185" height="125" rx="14" fill="url(#cardGrad1)" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.2" filter="url(#dropShadow)"/>
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">COMPLETION FUNNEL</text>
    
    <!-- Mini Animated Histogram -->
    <rect x="22" y="70" width="14" height="35" rx="3" fill="#6366f1" fill-opacity="0.6"/>
    <rect x="42" y="55" width="14" height="50" rx="3" fill="#818cf8" fill-opacity="0.75"/>
    <rect class="bar-anim-1" x="62" y="48" width="14" height="42" rx="3" fill="#38bdf8"/>
    <rect class="bar-anim-2" x="82" y="30" width="14" height="60" rx="3" fill="#a855f7"/>
    <rect class="bar-anim-3" x="102" y="15" width="14" height="75" rx="3" fill="#ec4899"/>
    
    <text x="124" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">86%</text>
    <text x="124" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Finish Rate</text>
  </g>

  <!-- Right Side Floating Card 1: Multi-Platform / Open Source Indicator -->
  <g class="floating-card-2" transform="translate(930, 65)">
    <rect width="210" height="125" rx="14" fill="url(#cardGrad1)" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1.2" filter="url(#dropShadow)"/>
    <text x="22" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">OPEN-SOURCE STACK</text>
    <text x="22" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">15+ <tspan font-size="14" font-weight="500" fill="#c084fc">Engines</tspan></text>
    
    <!-- Mini Tags -->
    <rect x="22" y="86" width="68" height="22" rx="6" fill="#6366f1" fill-opacity="0.2"/>
    <text x="30" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#a5b4fc">Formbricks</text>

    <rect x="96" y="86" width="62" height="22" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="105" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7dd3fc">SurveyJS</text>
  </g>

  <!-- Right Side Floating Card 2: Enterprise CX & Security -->
  <g class="floating-card-1" transform="translate(920, 225)">
    <rect width="220" height="125" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" filter="url(#dropShadow)"/>
    <circle class="live-dot" cx="26" cy="30" r="5" fill="#10b981"/>
    <text x="40" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ENTERPRISE COMPLIANCE</text>
    
    <text x="22" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">GDPR &amp; HIPAA</text>
    <text x="22" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Self-Hosted &amp; Headless Ready</text>
    
    <!-- Mini Star Rating Accent -->
    <g transform="translate(22, 102)" fill="#fbbf24">
      <path d="M5 0l1.5 3.5 3.5.5-2.5 2.5.6 3.5-3.1-1.6-3.1 1.6.6-3.5-2.5-2.5 3.5-.5z"/>
      <path d="M18 0l1.5 3.5 3.5.5-2.5 2.5.6 3.5-3.1-1.6-3.1 1.6.6-3.5-2.5-2.5 3.5-.5z"/>
      <path d="M31 0l1.5 3.5 3.5.5-2.5 2.5.6 3.5-3.1-1.6-3.1 1.6.6-3.5-2.5-2.5 3.5-.5z"/>
      <path d="M44 0l1.5 3.5 3.5.5-2.5 2.5.6 3.5-3.1-1.6-3.1 1.6.6-3.5-2.5-2.5 3.5-.5z"/>
      <path d="M57 0l1.5 3.5 3.5.5-2.5 2.5.6 3.5-3.1-1.6-3.1 1.6.6-3.5-2.5-2.5 3.5-.5z"/>
    </g>
    <text x="88" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">4.9 / 5.0</text>
  </g>

  <!-- ======================================================== -->
  <!-- FOREGROUND HERO CONTENT (Guaranteed Unobscured & Readable) -->
  <!-- ======================================================== -->
  <g transform="translate(600, 195)" text-anchor="middle">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, -115)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <text y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#a5b4fc" letter-spacing="1.2">
        ⚡ CURATED ECOSYSTEM DIRECTORY
      </text>
    </g>

    <!-- Main Title with Distinct Drop Shadow -->
    <text y="-40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#dropShadow)">
      Awesome Survey &amp; Feedback Management
    </text>

    <!-- Animated Gradient Accent Underline Bar -->
    <rect x="-180" y="-18" width="360" height="4" rx="2" fill="url(#accentGradient)"/>

    <!-- Subtitle (Clear, Crisp Contrast) -->
    <text y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Form Builders, Customer Experience (CX) Engines, NPS &amp; Open-Source Survey Architectures
    </text>

    <!-- Key Categories Pill Group -->
    <g transform="translate(0, 80)">
      <!-- Pill 1: SaaS Benchmarks -->
      <g transform="translate(-215, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
        <text y="4.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">📊 SaaS Pricing</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(-70, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
        <text y="4.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">⭐ Open Source</text>
      </g>
      <!-- Pill 3: Self-Hosting -->
      <g transform="translate(75, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
        <text y="4.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">🔒 Self-Hosted</text>
      </g>
      <!-- Pill 4: Feedback Loops -->
      <g transform="translate(220, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
        <text y="4.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">🔄 VoC Feedback</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGradient)"/>
</svg>
